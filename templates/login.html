<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Staff Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-serif-title { font-family: 'Merriweather', serif; }
        .bg-eclaro-navy { background-color: #031137; }
        .bg-eclaro-lime { background-color: #8CC63F; }
        .text-eclaro-lime { color: #8CC63F; }
    </style>
</head>
<body class="bg-eclaro-navy min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm space-y-5 border-t-4 border-eclaro-lime">
        <div class="text-center space-y-1">
            <span class="text-3xl font-black text-slate-900 tracking-widest font-serif-title">E<span class="text-eclaro-lime">C</span>LARO</span>
            <h2 class="text-lg font-bold text-slate-800 pt-2">Staff Portal Login</h2>
            <p class="text-xs text-slate-400">Gagamitin ng Admin at Registrar</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="text-xs p-3 rounded-xl bg-red-100 text-red-800 text-center font-semibold">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-3.5">
            <div>
                <label class="text-xs font-semibold text-slate-600">Username / Gmail / Mobile No.</label>
                <div class="mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-user text-slate-400 text-sm"></i>
                    <input type="text" name="username" required placeholder="e.g. registrar" class="bg-transparent text-sm w-full focus:outline-none">
                </div>
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-600">Password</label>
                <div class="mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-lock text-slate-400 text-sm"></i>
                    <input type="password" name="password" required placeholder="Password" class="bg-transparent text-sm w-full focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-eclaro-lime hover:bg-lime-600 text-slate-900 font-bold py-3 rounded-xl shadow-md transition-all uppercase text-xs tracking-wider mt-2">
                Log In
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-600">← Back to Registration</a>
        </div>
    </div>

</body>
</html>

</body>
</html>
