<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Personnel Login</title>
    <style>
        :root {
            --bg-dark: #0b132b;
            --card-dark: #101a36;
            --input-dark: #1c2541;
            --border-blue: #2a3a5e;
            --text-main: #ffffff;
            --lime-green: #88d400;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        .header {
            background-color: #070d1f;
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-blue);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--text-main);
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--lime-green);
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-dark);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-blue);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            color: var(--lime-green);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-blue);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
        }

        .btn {
            background-color: var(--lime-green);
            color: #000000;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            margin-top: 10px;
        }

        .alert-danger {
            background-color: #c62828;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ECLARO ACADEMY, INC.</h1>
        <p>Personnel Authentication Portal</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>Security Login</h2>

            {% with messages = get_flashed_messages(category_filter=["danger"]) %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" name="username" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" required placeholder="Enter password">
                </div>

                <button type="submit" class="btn">Log In</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #a0aec0; text-decoration: none; font-size: 13px;">← Return to Visitor Check-In Form</a>
        </p>
    </div>

</body>
</html>
