<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Eclaro VMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { eclaroGreen: '#85cc00', navy: '#0b192c' } } }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-brand-navy">Staff Portal Access</h2>
            <p class="text-xs text-slate-500 mt-1">Authorized personnel only (Default: admin / admin)</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 text-xs p-3 bg-red-100 border border-red-200 text-red-700 rounded-xl">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-brand-navy uppercase mb-1">Username</label>
                <input type="text" name="username" required placeholder="Username" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen">
            </div>

            <div>
                <label class="block text-xs font-bold text-brand-navy uppercase mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen">
            </div>

            <button type="submit" class="w-full bg-brand-navy text-white font-bold py-3.5 rounded-xl text-sm hover:bg-slate-800 transition-all">
                Login to Dashboard
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('index') }}" class="text-xs text-slate-500 hover:text-brand-navy">← Back to Visitor Kiosk</a>
        </div>
    </div>

</body>
</html>
