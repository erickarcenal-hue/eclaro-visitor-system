<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eclaro Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style> * { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-lg w-full max-w-sm space-y-4">
        <h2 class="text-xl font-bold text-slate-800 text-center">Staff / Registrar Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="text-xs p-3 rounded-xl bg-red-100 text-red-800 text-center font-semibold">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-3">
            <div>
                <label class="text-xs font-semibold text-slate-500">Username</label>
                <input type="text" name="username" required class="w-full border p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-500">Password</label>
                <input type="password" name="password" required class="w-full border p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <button type="submit" class="w-full bg-teal-600 text-white font-semibold py-3 rounded-xl mt-2 hover:bg-teal-700">Login</button>
        </form>
        <div class="text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-600">← Back to Registration</a>
        </div>
    </div>

</body>
</html>
