<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor Management System</title>
    <link rel="icon" type="image/png" href="https://www.eclaro.com/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-serif-title { font-family: 'Merriweather', serif; }
        .text-eclaro-lime { color: #8CC63F; }
        .bg-eclaro-lime { background-color: #8CC63F; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between text-white relative overflow-hidden">

    <!-- Background decorative gradients -->
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-[#8CC63F]/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <header class="w-full px-6 py-5 flex justify-end items-center max-w-7xl mx-auto z-10">
        <a href="/login" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl font-medium border border-slate-700 transition-all flex items-center gap-2">
            <i class="fas fa-lock text-[#8CC63F]"></i> Staff Portal
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 z-10">
        <div class="max-w-md w-full text-center space-y-6">
            <div class="w-24 h-24 bg-white/5 border border-white/10 rounded-3xl flex items-center justify-center mx-auto shadow-2xl backdrop-blur-md">
                <span class="text-5xl font-black font-serif-title text-[#8CC63F]">E</span>
            </div>

            <div class="space-y-2">
                <span class="text-xs uppercase tracking-widest text-[#8CC63F] font-semibold bg-[#8CC63F]/10 px-3 py-1 rounded-full border border-[#8CC63F]/20">SY 2026–2027</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold font-serif-title tracking-tight text-white mt-2">Eclaro Academy</h1>
                <p class="text-sm text-slate-400">Visitor Management System</p>
            </div>

            <div class="pt-4">
                <a href="/register" class="w-full bg-[#8CC63F] hover:bg-[#7ab332] text-slate-950 font-bold py-3.5 px-6 rounded-2xl text-sm transition-all shadow-lg shadow-[#8CC63F]/20 flex items-center justify-center gap-2 group">
                    <span>Get Started</span>
                    <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-[11px] text-slate-500 z-10 border-t border-slate-800/60">
        <p>© 2026 Eclaro Academy, Inc. All rights reserved. • Professional Light/White Theme Portal</p>
    </footer>

</body>
</html>
