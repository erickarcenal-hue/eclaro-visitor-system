<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Visitor Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style> * { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <div class="max-w-4xl mx-auto space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-slate-800">Visitor Log Dashboard</h1>
                <p class="text-xs text-slate-500">Logged in as: <span class="font-bold text-teal-600">{{ user }}</span></p>
            </div>
            <a href="/logout" class="text-xs bg-red-50 text-red-600 font-semibold px-4 py-2 rounded-xl hover:bg-red-100">Logout</a>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-500 uppercase border-b">
                        <tr>
                            <th class="p-3">Full Name</th>
                            <th class="p-3">Contact</th>
                            <th class="p-3">Purpose</th>
                            <th class="p-3">To Visit</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        {% if visitors %}
                            {% for visitor in visitors %}
                            <tr class="hover:bg-slate-50">
                                <td class="p-3 font-semibold text-slate-800">{{ visitor.name }}</td>
                                <td class="p-3 text-slate-600">{{ visitor.contact }}</td>
                                <td class="p-3 text-slate-600">{{ visitor.purpose }}</td>
                                <td class="p-3 text-slate-600">{{ visitor.person_to_visit }}</td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4" class="p-6 text-center text-slate-400 italic">No visitors recorded today.</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
