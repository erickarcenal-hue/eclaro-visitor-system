<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>ECLARO ACADEMY, INC.</h1>
        <p>Web-Based Visitor Management System (S.Y. 2026–2027)</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>Visitor Check-In Form</h2>

            {% if success %}
                <div class="alert alert-success">{{ msg }}</div>
                <a href="/" class="btn">Mag-log ng Bagong Bisita</a>
            {% else %}
                <form action="/" method="POST">
                    <div class="form-group">
                        <label>Buong Pangalan (Full Name):</label>
                        <input type="text" name="full_name" required placeholder="Juan Dela Cruz">
                    </div>
                    <div class="form-group">
                        <label>Numero ng Telepono (Contact No.):</label>
                        <input type="tel" name="contact_no" required placeholder="09123456789">
                    </div>
                    <div class="form-group">
                        <label>Layunin ng Pagbisita (Purpose):</label>
                        <select name="purpose" required>
                            <option value="">-- Pumili ng Layunin --</option>
                            <option value="Parent-Teacher Conference (PTC)">Parent-Teacher Conference (PTC)</option>
                            <option value="Inquiry / Enrollment">Inquiry / Enrollment</option>
                            <option value="Official Business / Staff Meeting">Official Business / Staff Meeting</option>
                            <option value="Delivery / Vendor">Delivery / Vendor</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Taong Bibisitahin (Person to Visit):</label>
                        <input type="text" name="person_to_visit" required placeholder="Pangalan ng Staff/Guro/Admin">
                    </div>

                    <!-- DATA PRIVACY ACT CONSENT CHECKBOX (R.A. 10173) -->
                    <div class="privacy-box">
                        <label style="font-weight: normal; font-size: 0.9em; display: flex; gap: 10px; align-items: flex-start;">
                            <input type="checkbox" name="privacy_consent" value="YES" required style="width: auto; margin-top: 3px;">
                            <span>Pinagtitibay ko na ang mga ibinigay kong impormasyon ay tama. Sumasang-ayon ako na kolektahin ng <strong>Eclaro Academy, Inc.</strong> ang aking datos para lamang sa seguridad ng campus alinsunod sa <strong>Data Privacy Act of 2012 (R.A. 10173)</strong>.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Submit Check-In</button>
                </form>
            {% endif %}
        </div>
        <p style="text-align: center;"><a href="/login" style="color: #666;">Authorized Personnel Login</a></p>
    </div>
</body>
</html>
