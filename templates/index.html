<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Visitor System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #e0f2fe 0%, #e6fffa 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-r from-teal-600 to-blue-600 p-6 text-white text-center relative">
            <h1 class="text-2xl font-bold">Eclaro Visitor System</h1>
            <p class="text-xs text-teal-100 mt-1">Please enter your details to check in.</p>
            <a href="/login" class="absolute top-4 right-4 text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-lg">Admin Login</a>
        </div>

        <div class="p-6">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mb-4 text-xs p-3 rounded-xl bg-emerald-100 text-emerald-800 text-center font-semibold">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/add" method="POST" class="space-y-4">
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-user text-slate-400 text-sm"></i>
                    <input type="text" name="name" required placeholder="Full Name" class="bg-transparent text-sm w-full focus:outline-none">
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-phone text-slate-400 text-sm"></i>
                    <input type="tel" name="contact" required placeholder="Contact Number" class="bg-transparent text-sm w-full focus:outline-none">
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-clipboard-list text-slate-400 text-sm"></i>
                    <input type="text" name="purpose" required placeholder="Purpose of Visit" class="bg-transparent text-sm w-full focus:outline-none">
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2.5">
                    <i class="fas fa-building text-slate-400 text-sm"></i>
                    <input type="text" name="person_to_visit" required placeholder="Person / Department to Visit" class="bg-transparent text-sm w-full focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl shadow-md transition-all active:scale-95">
                    Check in Visitor
                </button>
            </form>
        </div>
    </div>

</body>
</html>
