<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor Registration</title>
    <!-- Eclaro Logo / Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        :root {
            --bg-dark: #0b132b;
            --card-dark: #101a36;
            --input-dark: #1c2541;
            --border-blue: #2a3a5e;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --lime-green: #88d400;
            --lime-hover: #76b900;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        .header {
            background-color: #070d1f;
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-blue);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--lime-green);
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-dark);
            padding: 22px;
            border-radius: 12px;
            border: 1px solid var(--border-blue);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 18px;
            color: var(--lime-green);
            border-bottom: 1px solid var(--border-blue);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-blue);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
        }

        .form-group input::placeholder {
            color: #5c6b89;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--lime-green);
            box-shadow: 0 0 8px rgba(136, 212, 0, 0.3);
        }

        .privacy-box {
            background-color: rgba(28, 37, 65, 0.6);
            border-left: 4px solid var(--lime-green);
            padding: 12px;
            margin: 18px 0;
            border-radius: 4px;
        }

        .btn {
            background-color: var(--lime-green);
            color: #000000;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(136, 212, 0, 0.25);
        }

        .btn:hover {
            background-color: var(--lime-hover);
        }

        .alert-success {
            padding: 15px;
            background-color: #2e7d32;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .login-link a {
            color: var(--text-sub);
            font-size: 13px;
            text-decoration: none;
        }

        .login-link a:hover {
            color: var(--lime-green);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ECLARO ACADEMY, INC.</h1>
        <p>Web-Based Visitor Management System (S.Y. 2026–2027)</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>Visitor Check-In Form</h2>

            {% if success %}
                <div class="alert-success">{{ msg }}</div>
                <a href="/" class="btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">Register Another Visitor</a>
            {% else %}
                <form action="/" method="POST">
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" name="full_name" required placeholder="e.g. Juan Dela Cruz">
                    </div>

                    <div class="form-group">
                        <label>Contact Number:</label>
                        <input type="tel" name="contact_no" required placeholder="09123456789">
                    </div>

                    <div class="form-group">
                        <label>Purpose of Visit:</label>
                        <select name="purpose" required>
                            <option value="">-- Select Purpose --</option>
                            <option value="Parent-Teacher Conference (PTC)">Parent-Teacher Conference (PTC)</option>
                            <option value="Inquiry / Enrollment">Inquiry / Enrollment</option>
                            <option value="Official Business / Staff Meeting">Official Business / Staff Meeting</option>
                            <option value="Delivery / Vendor">Delivery / Vendor</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Person to Visit:</label>
                        <input type="text" name="person_to_visit" required placeholder="Name of Staff / Teacher / Admin">
                    </div>

                    <div class="privacy-box">
                        <label style="font-weight: normal; font-size: 12px; display: flex; gap: 10px; align-items: flex-start; margin: 0; color: var(--text-sub);">
                            <input type="checkbox" name="privacy_consent" value="YES" required style="width: auto; margin-top: 2px;">
                            <span>I hereby certify that the information provided is true and correct. I authorize <strong>Eclaro Academy, Inc.</strong> to collect and process my personal data solely for campus security and safety monitoring in compliance with the <strong>Data Privacy Act of 2012 (R.A. 10173)</strong>.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn">Submit Check-In</button>
                </form>
            {% endif %}
        </div>

        <div class="login-link">
            <a href="/login">Authorized Personnel Login</a>
        </div>
    </div>

</body>
</html>
