<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor System</title>
    <meta name="description" content="Official Visitor Registration & Gate Pass System for Eclaro Academy.">

    <!-- OPEN GRAPH (OG) META TAGS FOR YOUR OWN LINK PREVIEW -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Eclaro Academy - Visitor System">
    <meta property="og:description" content="Official Visitor Registration & Gate Pass System. Fill out details to get your digital entry pass.">
    <!-- Naka-set sa logo para lumabas ang picture sa link preview kapag isinend mo sa Messenger/WhatsApp -->
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Eclaro_Logo.png/600px-Eclaro_Logo.png">
    <meta property="og:url" content="https://eclaro-visitor-system.edu.ph">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            /* Official Eclaro Bright Lime Green */
                            eclaroGreen: '#85cc00', 
                            eclaroGreenHover: '#72b000',
                            navy: '#0b192c',
                            bgLight: '#FFFFFF',       /* White Background */
                            cardBg: '#FFFFFF',
                            inputBg: '#F8FAFC',
                            border: '#E2E8F0',
                            textDark: '#0F172A',
                            textMuted: '#64748B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-brand-bgLight text-brand-textDark min-h-screen flex flex-col justify-between selection:bg-brand-eclaroGreen selection:text-white">

    <!-- HEADER BAR -->
    <header class="w-full bg-white border-b border-brand-border py-4 px-6 md:px-12 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            
            <!-- ECLARO CREST LOGO -->
            <div class="flex items-center gap-3">
                <svg class="w-9 h-10 drop-shadow-sm" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 20 20 L 100 20 L 100 200 C 50 190 20 150 20 20 Z" fill="#0B192C"/>
                    <path d="M 100 20 L 180 20 L 180 20 C 180 150 150 190 100 200 Z" fill="#85CC00"/>
                    
                    <!-- Key Icon -->
                    <path d="M 45 75 L 75 45 M 70 40 L 80 50 M 63 47 L 70 54" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="43" cy="77" r="7" stroke="#FFFFFF" stroke-width="5" fill="none"/>
                    
                    <!-- Book Icon -->
                    <path d="M 115 40 Q 140 35 140 55 L 140 75 Q 115 55 115 40 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="2"/>
                    <path d="M 165 40 Q 140 35 140 55 L 140 75 Q 165 55 165 40 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="2"/>
                    
                    <!-- Center E Badge -->
                    <circle cx="100" cy="130" r="45" fill="#FFFFFF"/>
                    <circle cx="100" cy="130" r="38" fill="#0B192C"/>
                    <text x="100" y="148" font-family="'Georgia', serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">E</text>
                </svg>

                <!-- BRAND TITLE WITH ECOLARO GREEN 'E' -->
                <h1 class="text-2xl font-extrabold tracking-tight text-brand-navy">
                    <span class="text-brand-eclaroGreen">E</span>CLARO ACADEMY
                </h1>
            </div>

            <span class="bg-slate-100 text-brand-textMuted text-xs font-medium px-3 py-1 rounded-full border border-slate-200 hidden sm:inline-block">
                Visitor System (SY 2026–2027)
            </span>
        </div>

        <!-- STAFF LOGIN BUTTON -->
        <button class="flex items-center gap-2 bg-brand-eclaroGreen hover:bg-brand-eclaroGreenHover text-brand-navy text-xs font-bold px-4 py-2 rounded-lg transition-all shadow-sm">
            <i class="fa-solid fa-lock text-[10px]"></i>
            Staff Login
        </button>
    </header>

    <!-- MAIN FORM CONTAINER -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-6">
        <div class="w-full max-w-md bg-brand-cardBg border border-slate-200 rounded-2xl shadow-xl p-6 sm:p-8">
            
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-brand-navy tracking-tight">Visitor Registration</h2>
                <p class="text-brand-textMuted text-sm mt-1">Please fill out your details prior to entry.</p>
            </div>

            <form id="visitorForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                
                <!-- FULL NAME -->
                <div>
                    <label for="fullName" class="block text-xs font-bold text-brand-navy uppercase tracking-wider mb-1.5">
                        Full Name
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-brand-textMuted">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="fullName" required placeholder="e.g. Juan Dela Cruz"
                            class="w-full bg-brand-inputBg border border-slate-300 text-brand-textDark text-sm rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen focus:bg-white transition-all placeholder:text-slate-400">
                    </div>
                </div>

                <!-- CONTACT NUMBER -->
                <div>
                    <label for="contactNumber" class="block text-xs font-bold text-brand-navy uppercase tracking-wider mb-1.5">
                        Contact Number
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-brand-textMuted">
                            <i class="fa-solid fa-phone text-sm"></i>
                        </span>
                        <input type="tel" id="contactNumber" required placeholder="e.g. 09123456789"
                            class="w-full bg-brand-inputBg border border-slate-300 text-brand-textDark text-sm rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen focus:bg-white transition-all placeholder:text-slate-400">
                    </div>
                </div>

                <!-- PURPOSE OF VISIT -->
                <div>
                    <label for="purpose" class="block text-xs font-bold text-brand-navy uppercase tracking-wider mb-1.5">
                        Purpose of Visit
                    </label>
                    <div class="relative">
                        <select id="purpose" required
                            class="w-full bg-brand-inputBg border border-slate-300 text-brand-textDark text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen focus:bg-white transition-all appearance-none cursor-pointer">
                            <option value="" disabled selected>Select purpose...</option>
                            <option value="Inquiry / Enrollment">Inquiry / Enrollment</option>
                            <option value="Document Submission">Document Submission / Pickup</option>
                            <option value="Official Meeting">Official Meeting / Appointment</option>
                            <option value="Payment / Accounting">Payment / Accounting</option>
                            <option value="Other">Other</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-brand-textMuted">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- PERSON TO VISIT / DEPARTMENT -->
                <div>
                    <label for="department" class="block text-xs font-bold text-brand-navy uppercase tracking-wider mb-1.5">
                        Person to Visit / Department
                    </label>
                    <input type="text" id="department" required placeholder="e.g. Registrar Office / Dean"
                        class="w-full bg-brand-inputBg border border-slate-300 text-brand-textDark text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-eclaroGreen focus:bg-white transition-all placeholder:text-slate-400">
                </div>

                <!-- GENERATE GATE PASS BUTTON -->
                <button type="submit"
                    class="w-full mt-4 bg-brand-eclaroGreen hover:bg-brand-eclaroGreenHover text-brand-navy font-bold text-sm py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
                    <i class="fa-solid fa-qrcode"></i>
                    Generate Gate Pass
                </button>

            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-5 border-t border-brand-border bg-white text-center text-xs text-brand-textMuted">
        &copy; 2026 Eclaro Academy, Inc. All Rights Reserved.
    </footer>

    <!-- GATE PASS MODAL -->
    <div id="gatePassModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-brand-navy tracking-wider uppercase">Official Gate Pass</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- QR Container -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex flex-col items-center justify-center my-4">
                <div id="qrcode" class="my-2"></div>
                <p id="passId" class="text-xs font-mono font-bold text-slate-500 mt-2">ID: ---</p>
            </div>

            <div class="space-y-1 text-left bg-slate-50 p-3.5 rounded-xl border border-slate-100 text-xs mb-6">
                <p><strong class="text-brand-navy">Name:</strong> <span id="passName"></span></p>
                <p><strong class="text-brand-navy">Purpose:</strong> <span id="passPurpose"></span></p>
                <p><strong class="text-brand-navy">Visiting:</strong> <span id="passDept"></span></p>
                <p><strong class="text-brand-navy">Date:</strong> <span id="passDate"></span></p>
            </div>

            <button onclick="window.print()" class="w-full bg-brand-navy hover:bg-slate-800 text-white font-semibold text-xs py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-print"></i>
                Print / Save Pass
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let qrcode = null;

        function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('contactNumber').value;
            const purpose = document.getElementById('purpose').value;
            const dept = document.getElementById('department').value;
            const passCode = 'ECL-' + Math.floor(100000 + Math.random() * 900000);
            const currentDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            document.getElementById('passName').innerText = name;
            document.getElementById('passPurpose').innerText = purpose;
            document.getElementById('passDept').innerText = dept;
            document.getElementById('passDate').innerText = currentDate;
            document.getElementById('passId').innerText = 'ID: ' + passCode;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            qrcode = new QRCode(qrContainer, {
                text: JSON.stringify({ passCode, name, purpose, dept }),
                width: 160,
                height: 160,
                colorDark : "#0b192c",
                colorLight : "#FFFFFF",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('gatePassModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gatePassModal').classList.add('hidden');
            document.getElementById('visitorForm').reset();
        }
    </script>
</body>
</html>
