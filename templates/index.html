<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor Pass</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Modern Vibrant Dark Theme Styling -->
    <style>
        :root {
            --bg-dark: #0b132b;
            --card-dark: #101a36;
            --input-dark: #1c2541;
            --border-blue: #2a3a5e;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --lime-green: #88d400;
            --lime-hover: #76b900;
            --gold-warning: #ffb703;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        .header {
            background-color: #070d1f;
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-blue);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: var(--lime-green);
        }

        .container {
            max-width: 450px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-dark);
            padding: 22px;
            border-radius: 16px;
            border: 1px solid var(--border-blue);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            font-size: 16px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-blue);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .form-group input::placeholder {
            color: #5c6b89;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--lime-green);
            box-shadow: 0 0 8px rgba(136, 212, 0, 0.3);
        }

        .notice-box {
            background-color: rgba(255, 183, 3, 0.1);
            border: 1px solid rgba(255, 183, 3, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .notice-box span {
            font-size: 12px;
            color: #ffe082;
            line-height: 1.4;
        }

        .privacy-box {
            background-color: rgba(28, 37, 65, 0.6);
            border-left: 3px solid var(--lime-green);
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
        }

        .privacy-box label {
            font-weight: normal;
            font-size: 11px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin: 0;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .btn-lime {
            background-color: var(--lime-green);
            color: #000000;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 800;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(136, 212, 0, 0.3);
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-lime:hover {
            background-color: var(--lime-hover);
        }

        .alert-success {
            padding: 15px;
            background-color: #2e7d32;
            color: white;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .login-link a {
            color: var(--text-sub);
            font-size: 12px;
            text-decoration: none;
        }

        .login-link a:hover {
            color: var(--lime-green);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ECLARO ACADEMY, INC.</h1>
        <p>● Campus Visitor Management System</p>
    </div>

    <div class="container">
        <div class="card">

            {% if success %}
                <div class="alert-success">✓ {{ msg }}</div>
                <a href="/" class="btn-lime" style="text-decoration: none;">REGISTER ANOTHER VISITOR</a>
            {% else %}
                <form action="/" method="POST">
                    
                    <div class="form-group">
                        <label>Buong Pangalan (Full Name)</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" name="full_name" required placeholder="e.g. Juan Dela Cruz">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mobile Contact Number</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📱</span>
                            <input type="tel" name="contact_no" required placeholder="09123456789">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Purpose of Visit (Layunin)</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📋</span>
                            <select name="purpose" required>
                                <option value="">-- Select Purpose --</option>
                                <option value="Inquiry / Document Submission">Inquiry / Document Submission</option>
                                <option value="Parent-Teacher Conference (PTC)">Parent-Teacher Conference (PTC)</option>
                                <option value="Registrar / Cashier Transaction">Registrar / Cashier Transaction</option>
                                <option value="Official Business / Staff Meeting">Official Business / Staff Meeting</option>
                                <option value="Delivery / Vendor">Delivery / Vendor</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Person / Department to Visit</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🏫</span>
                            <input type="text" name="person_to_visit" required placeholder="Registrar / Cashier / Staff Name">
                        </div>
                    </div>

                    <!-- REQUIREMENT BANNER -->
                    <div class="notice-box">
                        <span style="font-size: 16px;">🪪</span>
                        <span><strong>Requirement:</strong> Maghanda ng <strong>School ID o Valid ID</strong> para sa verification ng Guard sa Gate.</span>
                    </div>

                    <!-- DATA PRIVACY CHECKBOX -->
                    <div class="privacy-box">
                        <label>
                            <input type="checkbox" name="privacy_consent" value="YES" required style="width: auto; margin-top: 2px;">
                            <span>Sumasang-ayon ako sa pagproseso ng aking datos para sa seguridad ng campus alinsunod sa <strong>Data Privacy Act of 2012 (R.A. 10173)</strong>.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-lime">GET VISITOR PASS ➔</button>
                </form>
            {% endif %}

        </div>

        <div class="login-link">
            <a href="/login">Authorized Personnel Login</a>
        </div>
    </div>

</body>
</html>
